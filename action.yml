name: Setup test environment

description: Setup test environment to use in other actions

inputs:
  python-version:
    description: "Python version passed to actions/setup-python"
    required: false
    default: "3.11"
  fetch-tags:
    description: >-
      Unshallow the checkout and fetch tags. Off by default: on base-platform this pulls
      ~120 MB / 11k commits / 364 tags and costs ~8s in every job that calls this action.
      Enable it only for jobs that actually read git history or version tags.
    required: false
    default: "false"

runs:
    using: "composite"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check out tags
        if: ${{ inputs.fetch-tags == 'true' }}
        shell: bash
        run: |
          git fetch --prune --unshallow --tags

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      # Only uv's cache is worth keeping. `~/.cache/pip` was in here too, but pip is used
      # for exactly one thing below (installing uv itself), so it only ever held a single
      # wheel that re-downloads in under a second.
      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-v2-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-v2-

      - name: Install requirements
        shell: bash
        run: |
          python -m pip install uv
          export UV_PROJECT_ENVIRONMENT="${pythonLocation}"
          uv sync --frozen --no-install-project --no-editable
          # Keep the saved cache small. `--ci` drops pre-built wheels and unzipped source
          # distributions -- both cheap to re-fetch -- and keeps wheels uv had to build from
          # source, which are not. Without it the cache grew to ~1.2 GB (~70k files), which
          # took 62s to untar in every job just to feed a `uv sync` that then ran in 3.5s.
          uv cache prune --ci
